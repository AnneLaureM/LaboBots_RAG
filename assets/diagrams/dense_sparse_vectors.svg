<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Vecteur dense vs vecteur sparse (BGE-M3, Section 4)</text>

  <!-- source chunk -->
  <rect x="330" y="45" width="240" height="46" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="450" y="64" text-anchor="middle" font-size="11">chunk de texte : "Slurm est</text>
  <text x="450" y="79" text-anchor="middle" font-size="11">l'ordonnanceur du cluster CC-IN2P3..."</text>

  <line x1="400" y1="91" x2="220" y2="120" stroke="#555" stroke-width="1.5"/>
  <line x1="500" y1="91" x2="680" y2="120" stroke="#555" stroke-width="1.5"/>

  <!-- Dense vector panel -->
  <g>
    <text x="220" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Vecteur DENSE (1024 dim.)</text>
    <text x="220" y="152" text-anchor="middle" font-size="11" fill="#555">quasiment toutes les dimensions sont non nulles</text>
    <text x="220" y="166" text-anchor="middle" font-size="11" fill="#555">-&gt; capture le sens global (semantique)</text>

    <!-- bar chart, many small bars, all non-zero, continuous values -->
    <g transform="translate(60,180)">
      <line x1="0" y1="90" x2="320" y2="90" stroke="#999" stroke-width="1"/>
      <!-- 32 bars representative of 1024 dims -->
      <g fill="#43a047">
        <rect x="0"   y="55" width="7" height="35"/>
        <rect x="10"  y="30" width="7" height="60"/>
        <rect x="20"  y="70" width="7" height="20"/>
        <rect x="30"  y="15" width="7" height="75"/>
        <rect x="40"  y="45" width="7" height="45"/>
        <rect x="50"  y="60" width="7" height="30"/>
        <rect x="60"  y="20" width="7" height="70"/>
        <rect x="70"  y="50" width="7" height="40"/>
        <rect x="80"  y="35" width="7" height="55"/>
        <rect x="90"  y="65" width="7" height="25"/>
        <rect x="100" y="10" width="7" height="80"/>
        <rect x="110" y="48" width="7" height="42"/>
        <rect x="120" y="58" width="7" height="32"/>
        <rect x="130" y="25" width="7" height="65"/>
        <rect x="140" y="40" width="7" height="50"/>
        <rect x="150" y="68" width="7" height="22"/>
        <rect x="160" y="30" width="7" height="60"/>
        <rect x="170" y="52" width="7" height="38"/>
        <rect x="180" y="18" width="7" height="72"/>
        <rect x="190" y="44" width="7" height="46"/>
        <rect x="200" y="62" width="7" height="28"/>
        <rect x="210" y="33" width="7" height="57"/>
        <rect x="220" y="12" width="7" height="78"/>
        <rect x="230" y="47" width="7" height="43"/>
        <rect x="240" y="57" width="7" height="33"/>
        <rect x="250" y="28" width="7" height="62"/>
        <rect x="260" y="42" width="7" height="48"/>
        <rect x="270" y="66" width="7" height="24"/>
        <rect x="280" y="22" width="7" height="68"/>
        <rect x="290" y="50" width="7" height="40"/>
        <rect x="300" y="36" width="7" height="54"/>
        <rect x="310" y="60" width="7" height="30"/>
      </g>
      <text x="160" y="112" text-anchor="middle" font-size="11" fill="#666">[0.021, -0.084, 0.113, ... ] (1024 valeurs continues)</text>
      <text x="160" y="128" text-anchor="middle" font-size="11" fill="#666">-&gt; comparees par similarite cosinus</text>
    </g>
  </g>

  <!-- Sparse vector panel -->
  <g>
    <text x="680" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef6c00">Vecteur SPARSE (~vocabulaire entier)</text>
    <text x="680" y="152" text-anchor="middle" font-size="11" fill="#555">quasiment toutes les dimensions sont a 0</text>
    <text x="680" y="166" text-anchor="middle" font-size="11" fill="#555">-&gt; poids fort sur quelques mots-cles</text>

    <g transform="translate(520,180)">
      <line x1="0" y1="90" x2="320" y2="90" stroke="#999" stroke-width="1"/>
      <!-- mostly zero-height bars, a few tall ones -->
      <g fill="#fb8c00">
        <rect x="0"   y="88" width="7" height="0"/>
        <rect x="10"  y="88" width="7" height="0"/>
        <rect x="20"  y="88" width="7" height="0"/>
        <rect x="30"  y="20" width="7" height="70"/>
        <text x="33" y="14" text-anchor="middle" font-size="10" fill="#333">"slurm"</text>
        <rect x="40"  y="88" width="7" height="0"/>
        <rect x="50"  y="88" width="7" height="0"/>
        <rect x="60"  y="88" width="7" height="0"/>
        <rect x="70"  y="88" width="7" height="0"/>
        <rect x="80"  y="88" width="7" height="0"/>
        <rect x="90"  y="45" width="7" height="45"/>
        <text x="93" y="39" text-anchor="middle" font-size="10" fill="#333">"cluster"</text>
        <rect x="100" y="88" width="7" height="0"/>
        <rect x="110" y="88" width="7" height="0"/>
        <rect x="120" y="88" width="7" height="0"/>
        <rect x="130" y="88" width="7" height="0"/>
        <rect x="140" y="88" width="7" height="0"/>
        <rect x="150" y="88" width="7" height="0"/>
        <rect x="160" y="30" width="7" height="60"/>
        <text x="163" y="24" text-anchor="middle" font-size="10" fill="#333">"ordonnanceur"</text>
        <rect x="170" y="88" width="7" height="0"/>
        <rect x="180" y="88" width="7" height="0"/>
        <rect x="190" y="88" width="7" height="0"/>
        <rect x="200" y="88" width="7" height="0"/>
        <rect x="210" y="88" width="7" height="0"/>
        <rect x="220" y="88" width="7" height="0"/>
        <rect x="230" y="88" width="7" height="0"/>
        <rect x="240" y="88" width="7" height="0"/>
        <rect x="250" y="65" width="7" height="25"/>
        <text x="253" y="59" text-anchor="middle" font-size="10" fill="#333">"cc-in2p3"</text>
        <rect x="260" y="88" width="7" height="0"/>
        <rect x="270" y="88" width="7" height="0"/>
        <rect x="280" y="88" width="7" height="0"/>
        <rect x="290" y="88" width="7" height="0"/>
        <rect x="300" y="88" width="7" height="0"/>
        <rect x="310" y="88" width="7" height="0"/>
      </g>
      <text x="160" y="112" text-anchor="middle" font-size="11" fill="#666">{ "slurm": 0.41, "cluster": 0.22, "ordonnanceur": 0.31, ... }</text>
      <text x="160" y="128" text-anchor="middle" font-size="11" fill="#666">-&gt; poids appris par BGE-M3 (pas la formule BM25)</text>
    </g>
  </g>

  <rect x="150" y="345" width="600" height="90" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="450" y="368" text-anchor="middle" font-size="12" font-weight="bold">BGE-M3 produit les deux vecteurs en un seul passage du modele</text>
  <text x="450" y="388" text-anchor="middle" font-size="11">Dense : bon pour le sens ("panne reseau" ~ "probleme de connectivite")</text>
  <text x="450" y="405" text-anchor="middle" font-size="11">Sparse : bon pour les termes exacts (identifiants, acronymes, noms de commandes)</text>
  <text x="450" y="422" text-anchor="middle" font-size="11">Les deux resultats sont combines par Reciprocal Rank Fusion (Section 6)</text>

  <text x="450" y="460" text-anchor="middle" font-size="10" fill="#999">notebook 1, Section 4 — Embeddings dense et sparse a partir d'un seul modele (BGE-M3)</text>
</svg>
