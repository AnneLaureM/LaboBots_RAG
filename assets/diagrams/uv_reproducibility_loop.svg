<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#172b4d">Le cycle reproductible d'un projet Python</text>
  <text x="490" y="56" text-anchor="middle" font-size="12" fill="#52606d">Ce que chaque fichier ou commande controle dans ce workshop</text>

  <g>
    <rect x="45" y="105" width="170" height="92" rx="9" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="130" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">pyproject.toml</text>
    <text x="130" y="153" text-anchor="middle" font-size="11">intentions du projet</text>
    <text x="130" y="170" text-anchor="middle" font-size="11">dependances + extras</text>
    <text x="130" y="187" text-anchor="middle" font-size="10" fill="#52606d">ce que l'on demande</text>
  </g>
  <g>
    <rect x="270" y="105" width="170" height="92" rx="9" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="355" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">uv.lock</text>
    <text x="355" y="153" text-anchor="middle" font-size="11">resolution exacte</text>
    <text x="355" y="170" text-anchor="middle" font-size="11">versions + hashes</text>
    <text x="355" y="187" text-anchor="middle" font-size="10" fill="#52606d">ce qui a ete resolu</text>
  </g>
  <g>
    <rect x="495" y="105" width="170" height="92" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="580" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">.venv</text>
    <text x="580" y="153" text-anchor="middle" font-size="11">environnement isole</text>
    <text x="580" y="170" text-anchor="middle" font-size="11">interpreteur + paquets</text>
    <text x="580" y="187" text-anchor="middle" font-size="10" fill="#52606d">ce qui est installe</text>
  </g>
  <g>
    <rect x="720" y="105" width="215" height="92" rx="9" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
    <text x="827" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a148c">uv run / kernel Jupyter</text>
    <text x="827" y="153" text-anchor="middle" font-size="11">execution coherente</text>
    <text x="827" y="170" text-anchor="middle" font-size="11">avec le projet</text>
    <text x="827" y="187" text-anchor="middle" font-size="10" fill="#52606d">ce qui s'execute vraiment</text>
  </g>

  <line x1="215" y1="151" x2="268" y2="151" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="151" x2="493" y2="151" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="151" x2="718" y2="151" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M827 210 C827 300, 130 300, 130 210" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
  <text x="490" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#52606d">uv sync reconstruit l'environnement ; une nouvelle machine recommence le meme cycle</text>

  <rect x="190" y="335" width="600" height="52" rx="8" fill="#f5f7fa" stroke="#c4cdd5"/>
  <text x="490" y="357" text-anchor="middle" font-size="12" fill="#172b4d">Verification utile : comparer sys.executable et uv run python -c "import sys; print(sys.executable)"</text>
  <text x="490" y="375" text-anchor="middle" font-size="11" fill="#52606d">S'ils divergent, le terminal et le notebook ne parlent probablement pas au meme environnement.</text>
</svg>
