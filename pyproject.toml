[project]
name = "labobots-rag-workshop"
version = "0.1.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
description = "Reproducible environment for the LaboBots local and distributed RAG workshop"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.5,<2",
    "ipykernel>=6.29",
    "jupyterlab>=4",
    "lxml>=5",
    "numpy>=1.26",
    "ollama>=0.4",
    "pandas>=2",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "streamlit>=1.40",
    "tqdm>=4.66",
    "pysqlite3-binary>=0.5.4",
]


[project.optional-dependencies]
embeddings = [
    "FlagEmbedding>=1.3",
    "torchvision>=0.29.0",
]
agent = [
    "python-dotenv==1.1.0",
    "langchain==1.3.2",
    "langchain-core==1.4.0",
    "langchain-openai==1.2.2",
    "langchain-community==0.4.1",
    "langgraph==1.2.2",
    "openai>=2.26",
    "wikipedia==1.4.0",
    # vLLM needs a Linux/CUDA host; skip it elsewhere (e.g. macOS).
    "vllm==0.22.0; sys_platform == 'linux'",
]
secure-app = [
    "Authlib>=1.3",
    "streamlit-authenticator>=0.4",
    "streamlit-option-menu>=0.4",
]

[tool.uv]
default-groups = []
# vLLM pins its own torch/torchvision, which clashes with the embeddings extra.
conflicts = [
    [{ extra = "agent" }, { extra = "embeddings" }],
]

[tool.uv.sources]
# Keep all workshop packages on the standard Python package index.
