[project]
name = "labobots-rag-workshop"
version = "0.1.0"
description = "Reproducible environment for the LaboBots local and distributed RAG workshop"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.5,<2",
    "ipykernel>=6.29",
    "jupyterlab>=4",
    "lxml>=5",
    "numpy>=1.26",
    "ollama>=0.4",
    "pandas>=2",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "streamlit>=1.40",
    "tqdm>=4.66",
]

[project.optional-dependencies]
embeddings = [
    "FlagEmbedding>=1.3",
    "torchvision>=0.29.0",
]
secure-app = [
    "Authlib>=1.3",
    "streamlit-authenticator>=0.4",
    "streamlit-option-menu>=0.4",
]

[tool.uv]
default-groups = []

[tool.uv.sources]
# Keep all workshop packages on the standard Python package index.
